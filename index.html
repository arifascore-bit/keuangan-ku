<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keuanganku</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4CAF50">
  <style>
    body { font-family: 'Segoe UI'; background: linear-gradient(135deg, #e8f5e9, #c8e6c9); padding: 20px; }
    h1 { color: #2E7D32; text-align: center; }
    .saldo { font-size: 28px; font-weight: bold; color: #2E7D32; background: white; padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .box { background: white; padding: 20px; border-radius: 15px; margin-bottom: 15px; }
    input, select { padding: 12px; width: 95%; border-radius: 10px; border: 2px solid #4CAF50; font-size: 16px; margin: 8px 0; }
    button { padding: 14px 20px; border-radius: 10px; border: none; background: #4CAF50; color: white; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; }
    .pemasukan { color: #2E7D32; font-weight: bold; } .pengeluaran { color: #D32F2F; font-weight: bold; }
    #riwayat { max-width: 600px; margin: 20px auto; }
    .item { background: white; padding: 15px; margin: 10px 0; border-radius: 10px; display: flex; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <h1>💰 Keuanganku 💰</h1>
  <div class="saldo">Saldo: Rp <span id="totalSaldo">0</span></div>

  <div class="box">
    <input type="text" id="keterangan" placeholder="Keterangan: Gaji, Beli Makan">
    <input type="number" id="jumlah" placeholder="Jumlah: 50000">
    <select id="jenis">
      <option value="pemasukan">+ Pemasukan</option>
      <option value="pengeluaran">- Pengeluaran</option>
    </select>
    <button onclick="tambahData()">Simpan Transaksi</button>
  </div>

  <h3 style="text-align:center;">Riwayat</h3>
  <div id="riwayat"></div>

  <script>
    let db;
    let request = indexedDB.open("KeuanganDBv2", 1);
    request.onupgradeneeded = e => { db = e.target.result; db.createObjectStore("transaksi", {keyPath: "id", autoIncrement: true}); };
    request.onsuccess = e => { db = e.target.result; tampilkanData(); }

    function tampilkanData() {
      let tx = db.transaction("transaksi", "readonly"); let store = tx.objectStore("transaksi"); let req = store.getAll();
      req.onsuccess = () => {
        let data = req.result; let saldo = 0; let html = '';
        data.reverse().forEach(t => {
          saldo += t.jenis === 'pemasukan' ? t.jumlah : -t.jumlah;
          html += `<div class="item"><div>${t.keterangan} <br><small class="${t.jenis}">${t.jenis}</small></div><div class="${t.jenis}">Rp ${t.jumlah.toLocaleString()}</div></div>`;
        });
        document.getElementById('riwayat').innerHTML = html || '<p style="color:gray;text-align:center;">Belum ada transaksi</p>';
        document.getElementById('totalSaldo').innerText = saldo.toLocaleString();
      }
    }
    function tambahData() {
      let ket = document.getElementById('keterangan').value; let jum = parseInt(document.getElementById('jumlah').value); let jen = document.getElementById('jenis').value;
      if(ket === '' || !jum) return alert('Isi semua dulu!');
      let tx = db.transaction("transaksi", "readwrite"); tx.objectStore("transaksi").add({keterangan: ket, jumlah: jum, jenis: jen});
      tx.oncomplete = () => { document.getElementById('keterangan').value = ''; document.getElementById('jumlah').value = ''; tampilkanData(); }
    }
    if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
  </script>
</body>
</html>
